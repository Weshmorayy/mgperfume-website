<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="100%" stop-color="#0F0E0D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B3F"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#C59B3F"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  
  <!-- Decorative background circles -->
  <circle cx="300" cy="300" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.2"/>
  <circle cx="300" cy="300" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,4" opacity="0.25"/>

  <!-- Bottle Silhouette -->
  <!-- Cap -->
  <rect x="260" y="160" width="80" height="40" rx="4" fill="url(#goldGrad)"/>
  <rect x="270" y="200" width="60" height="15" fill="#1A1816" stroke="url(#goldGrad)" stroke-width="1"/>
  
  <!-- Main Glass Body -->
  <rect x="210" y="215" width="180" height="230" rx="16" fill="#221F1C" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="225" y="230" width="150" height="200" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Label Badge -->
  <rect x="235" y="280" width="130" height="100" rx="6" fill="#171513" stroke="url(#goldGrad)" stroke-width="1.5"/>
  
  <!-- Text inside Label -->
  <text x="300" y="318" fill="#FBF8F3" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">MG PERFUME</text>
  <line x1="260" y1="330" x2="340" y2="330" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>
  <text x="300" y="352" fill="#C59B3F" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="2">EN ATTENTE DE VISUEL</text>
  
  <!-- Bottom Brand Subtext -->
  <text x="300" y="500" fill="#9E968D" font-family="sans-serif" font-size="11" text-anchor="middle" letter-spacing="3">HAUTE PARFUMERIE DAKAR</text>
</svg>
