<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B3F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C59B3F"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle border & inner background -->
  <rect x="20" y="20" width="560" height="560" fill="none" stroke="#E8DCC2" stroke-width="1"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="#E8DCC2" stroke-width="1" opacity="0.6"/>
  <circle cx="300" cy="300" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Bottle Silhouette -->
  <!-- Cap -->
  <rect x="260" y="160" width="80" height="40" rx="6" fill="url(#goldGrad)"/>
  <rect x="270" y="200" width="60" height="15" fill="#FAF8F5" stroke="url(#goldGrad)" stroke-width="1.5"/>
  
  <!-- Main Glass Body -->
  <rect x="210" y="215" width="180" height="230" rx="18" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="225" y="230" width="150" height="200" rx="12" fill="none" stroke="#E8DCC2" stroke-width="1"/>
  
  <!-- Label Badge -->
  <rect x="235" y="280" width="130" height="100" rx="8" fill="#171513" stroke="url(#goldGrad)" stroke-width="1.5"/>
  
  <!-- Text inside Label -->
  <text x="300" y="318" fill="#FBF8F3" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">MG PERFUME</text>
  <line x1="260" y1="330" x2="340" y2="330" stroke="url(#goldGrad)" stroke-width="1" opacity="0.8"/>
  <text x="300" y="352" fill="#F3E5AB" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="2">HAUTE PARFUMERIE</text>
  
  <!-- Bottom Brand Subtext -->
  <text x="300" y="495" fill="#171513" font-family="serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3">EDITION D'EXCEPTION</text>
  <text x="300" y="515" fill="#C59B3F" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">DAKAR</text>
</svg>
