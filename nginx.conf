# ==============================================================================
# NGINX CONFIGURATION FOR HOSTINGER VPS / STATIC DEPLOYMENT
# Place in /etc/nginx/sites-available/client-site and symlink to sites-enabled
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name client-domain.fr www.client-domain.fr;

    # Root folder for Next.js static export ('npm run build' with NEXT_OUTPUT=export)
    root /var/www/client-site/out;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static assets caching (1 year for hashed Next.js files)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public images caching (30 days)
    location /images/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Routing fallback for clean URLs
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Custom 404 page
    error_page 404 /404.html;
}
